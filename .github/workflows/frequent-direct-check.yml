name: Frequent Direct Source Check

on:
  schedule:
    # Every 2 hours. This only checks direct_sources (Greenhouse/Lever/Ashby),
    # which have no API key / rate limit - safe to run often.
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync with latest before running
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase

      - name: Run job fetcher (direct sources only)
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fetch_jobs.py --direct-only

      - name: Commit and push updated data
        run: |
          git add docs/data.json seen_jobs.json
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Direct source check $(date -u +%Y-%m-%dT%H:%M)"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded."
                break
              fi
              echo "Push failed, pulling and retrying..."
              git pull --rebase
              sleep 5
            done
          fi
