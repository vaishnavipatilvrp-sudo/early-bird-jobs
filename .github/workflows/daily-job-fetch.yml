name: Daily Job Fetch

on:
  schedule:
    # 5:00 AM Central (CDT = UTC-5, so 10:00 UTC)
    - cron: '0 10 * * *'
    # 10:00 AM Central (CDT = UTC-5, so 15:00 UTC)
    - cron: '0 15 * * *'
    # 2:00 PM Central (CDT = UTC-5, so 19:00 UTC)
    - cron: '0 19 * * *'
    # 9:00 PM Central (CDT = UTC-5, so 02:00 UTC next day)
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job fetcher
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fetch_jobs.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add docs/data.json seen_jobs.json
          git diff --quiet --cached || git commit -m "Update job listings $(date -u +%Y-%m-%d)"
          git push
